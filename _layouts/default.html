<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="author" content="{{ site.author }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header class="site-head">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark">&gt;_</span>
      <span class="brand-name">Cyb3r_N1nj4</span>
    </a>
    <nav>
      <a href="{{ '/' | relative_url }}">Posts</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ site.rules_repo }}">Rules</a>
    </nav>
  </div>
</header>

<main class="wrap">
{{ content }}
</main>

<footer class="site-foot">
  <div class="wrap">
    <p>{{ site.author }} — threat research notes. Content is published for defensive use.</p>
    <p class="muted">Indicators are defanged. Nothing here is operational malware.</p>
  </div>
</footer>
</body>
</html>
